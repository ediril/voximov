server {
    listen 80;
    listen [::]:80;

    server_name voximov.com www.voximov.com;

    root /var/www/voximov;
    index index.php;

    if ($host = www.voximov.com) {
        return 301 https://voximov.com$request_uri;
    }

    error_page 404 /404.php;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ^~ /_blog_posts/ {
        return 404;
    }

    location ^~ /tests/ {
        return 404;
    }

    location = /router.php {
        return 404;
    }

    location ~ \.(md|sh|conf)$ {
        return 404;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location = /feed.xml {
        rewrite ^ /feed.php last;
    }

    location = /blog/ {
        return 301 /blog;
    }

    location ~ "^/blog/([a-z0-9-]+)/?$" {
        rewrite "^/blog/([a-z0-9-]+)/?$" /blog-post.php?slug=$1 last;
    }

    location / {
        try_files $uri $uri/ @clean_url;
    }

    location @clean_url {
        rewrite ^/(.+)$ /$1.php last;
    }

    location ~ \.php$ {
        if ($request_uri ~ ^/(?!index\.php)([^/?]+)\.php(\?.*)?$) {
            return 301 /$1$2;
        }

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
}

name: Bug report
description: Something does not work as expected
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a video
        2. Record a take
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you installed, for example 1.3.1.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - macOS build
        - Windows EXE
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      description: macOS or Windows version.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Media and extra details
      description: The container and codecs of the imported video, error messages, or screenshots. Do not attach private recordings.
